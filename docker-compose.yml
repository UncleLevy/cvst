# PostgreSQL + Redis for local development.
# Start with:  docker compose up -d
# Override the defaults by exporting POSTGRES_PASSWORD (etc.) or using a root .env file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvst_db}
      POSTGRES_USER: ${POSTGRES_USER:-cvst_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
